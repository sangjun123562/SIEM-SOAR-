# A · 1일 차 시험망: 단말 → 게이트웨이 → 임시 HTTP 서버
# 호스트 포트 공개 없음. 네트워크는 internal(외부 연결 없음). 게이트웨이와 라우트 사이드카만 NET_ADMIN 예외.
#
# 설계 메모: Docker(29.x)는 호스트 쪽에서 '다른 Docker 네트워크의 컨테이너 IP로 향하는 패킷'을 차단해,
# 브리지를 둘로 나눈 게이트웨이 구성은 경로·옵션(trusted_host_interfaces, nat-unprotected)을 써도 통과하지
# 못했다(2026-11-17 시험). 호스트 Docker 설정은 바꾸지 않기 위해 브리지 하나를 쓰고, 서브넷을 단말망
# 172.28.10.0/24, 서버망 172.28.20.0/24로 논리 분리한다. 단말·서버는 사이드카가 설정한 경로로 게이트웨이
# (172.28.0.2)만 통해 통신한다(직접 on-link 경로 제거). 단말은 NET_ADMIN/NET_RAW가 없어 경로를 바꿀 수 없다.
# 게이트웨이는 NAT를 하지 않으므로 서버에서 실제 단말 IP가 보인다.
name: capstone-a

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

networks:
  lab_net:
    internal: true
    ipam:
      config: [{subnet: 172.28.0.0/16}]

volumes:
  gw_logs:
  caddy_raw:    # Caddy 원본 접속 로그(변환기가 읽기 전용으로 읽음)
  caddy_logs:   # caddy.jsonl(계약 형식). 수집기는 :ro로 마운트
  caddy_data:   # Caddy 내부 CA(개인키 포함). Caddy만 마운트하고 단말에는 절대 노출하지 않는다
  caddy_ca:     # 공개 루트 인증서(root.crt)만 담아 단말이 :ro로 신뢰 저장소로 사용

services:
  gateway:
    <<: *hardening
    build: ./gateway
    image: capstone-a-gateway:day1
    container_name: capstone-a-gateway
    cap_add: [NET_ADMIN]          # 예외: iptables 차단 규칙 적용. 이 컨테이너 네임스페이스에만 영향
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
    read_only: true
    tmpfs: ["/run:size=8m,mode=0755", "/tmp:size=8m"]
    volumes:
      - gw_logs:/var/log/gw        # gateway.jsonl. 수집기는 이 볼륨을 읽기 전용(:ro)으로 마운트한다
    environment:
      GW_BLOCKABLE: 172.28.10.11   # 차단 허용 목록: 시험 단말 고정 IP 하나
      GW_DST_ALLOWED: 172.28.20.10,172.28.20.5   # 임시 서버와 Caddy
    cpus: 0.25
    mem_limit: 96m
    networks:
      lab_net: {ipv4_address: 172.28.0.2}

  web:
    <<: *hardening
    image: python:3.12-alpine
    container_name: capstone-a-web
    user: "65534:65534"
    read_only: true
    command: ["python", "/app/server.py"]
    volumes: ["./web/server.py:/app/server.py:ro"]
    cpus: 0.25
    mem_limit: 64m
    networks:
      lab_net: {ipv4_address: 172.28.20.10}

  client-test:                    # 차단 대상 시험 단말
    <<: *hardening
    image: alpine:3.20
    container_name: capstone-a-client-test
    user: "65534:65534"
    read_only: true
    command: ["sleep", "infinity"]
    environment: {SSL_CERT_FILE: /trust/root.crt}   # Caddy 루트 인증서만 신뢰
    volumes: ["caddy_ca:/trust:ro"]
    depends_on:
      caddy-ca-export: {condition: service_completed_successfully}
    cpus: 0.1
    mem_limit: 32m
    networks:
      lab_net: {ipv4_address: 172.28.10.11}

  client-ref:                     # 대조 단말(차단 금지)
    <<: *hardening
    image: alpine:3.20
    container_name: capstone-a-client-ref
    user: "65534:65534"
    read_only: true
    command: ["sleep", "infinity"]
    environment: {SSL_CERT_FILE: /trust/root.crt}   # Caddy 루트 인증서만 신뢰
    volumes: ["caddy_ca:/trust:ro"]
    depends_on:
      caddy-ca-export: {condition: service_completed_successfully}
    cpus: 0.1
    mem_limit: 32m
    networks:
      lab_net: {ipv4_address: 172.28.10.12}

  # 경로 설정 일회용 사이드카: 대상 컨테이너의 네임스페이스에서만 실행하고 종료한다.
  # on-link /16 경로를 게이트웨이(172.28.0.2) 경유 경로로 교체한다. replace라서 여러 번 실행해도 결과가 같다(멱등).
  route-test: &route
    <<: *hardening
    image: alpine:3.20
    container_name: capstone-a-route-test
    network_mode: "service:client-test"
    user: "0:0"
    cap_add: [NET_ADMIN]
    restart: "no"
    command: ["sh", "-c", "ip route replace 172.28.0.2 dev eth0 scope link && ip route replace 172.28.0.0/16 via 172.28.0.2 dev eth0"]
    cpus: 0.1
    mem_limit: 16m
    depends_on: [client-test, gateway]
  route-ref:
    <<: *route
    container_name: capstone-a-route-ref
    network_mode: "service:client-ref"
    depends_on: [client-ref, gateway]
  route-web:
    <<: *route
    container_name: capstone-a-route-web
    network_mode: "service:web"
    depends_on: [web, gateway]

  # 볼륨 소유자를 비 root 사용자로 맞추는 일회용 초기화(CHOWN만 허용, 종료 후 사라짐)
  caddy-init:
    <<: *hardening
    image: alpine:3.20
    container_name: capstone-a-caddy-init
    user: "0:0"
    cap_add: [CHOWN]
    restart: "no"
    command: ["chown", "65534:65534", "/raw", "/out", "/data", "/ca_out"]
    volumes: ["caddy_raw:/raw", "caddy_logs:/out", "caddy_data:/data", "caddy_ca:/ca_out"]
    cpus: 0.1
    mem_limit: 16m
    network_mode: none

  caddy:
    <<: *hardening
    image: caddy:2-alpine          # 시험 시점 v2.11.9
    container_name: capstone-a-caddy
    user: "65534:65534"
    read_only: true
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_raw:/var/log/caddy
      - caddy_data:/data
    tmpfs: ["/config:size=8m,uid=65534,gid=65534"]
    cpus: 0.25
    mem_limit: 96m
    depends_on:
      caddy-init: {condition: service_completed_successfully}
    networks:
      lab_net: {ipv4_address: 172.28.20.5}

  # Caddy 공개 루트 인증서만 caddy_ca로 복사하는 일회용 서비스(CA 개인키는 복사하지 않음)
  caddy-ca-export:
    <<: *hardening
    image: alpine:3.20
    container_name: capstone-a-caddy-ca-export
    user: "65534:65534"           # Caddy와 같은 비 root 사용자(CA 디렉터리가 0700이라 소유자만 읽을 수 있음)
    restart: "no"
    network_mode: none
    command:
      - sh
      - -c
      - |
        i=0
        while [ ! -s /ca/caddy/pki/authorities/local/root.crt ] && [ $$i -lt 60 ]; do sleep 1; i=$$((i+1)); done
        cp /ca/caddy/pki/authorities/local/root.crt /out/root.crt && chmod 644 /out/root.crt
    volumes: ["caddy_data:/ca:ro", "caddy_ca:/out"]
    cpus: 0.1
    mem_limit: 16m
    depends_on: [caddy]

  caddy-log:                      # Caddy 원본 로그 -> 계약 형식 caddy.jsonl
    <<: *hardening
    image: python:3.12-alpine
    container_name: capstone-a-caddy-log
    user: "65534:65534"
    read_only: true
    command: ["python", "-I", "/app/caddy2jsonl.py"]
    environment: {PYTHONDONTWRITEBYTECODE: "1"}
    volumes:
      - ./caddy/caddy2jsonl.py:/app/caddy2jsonl.py:ro
      - caddy_raw:/in:ro
      - caddy_logs:/out
    tmpfs: ["/tmp:size=4m"]
    cpus: 0.1
    mem_limit: 32m
    depends_on:
      caddy-init: {condition: service_completed_successfully}
    network_mode: none            # 볼륨만 읽고 쓰므로 네트워크 불필요

  route-caddy:
    <<: *route
    container_name: capstone-a-route-caddy
    network_mode: "service:caddy"
    command: ["sh", "-c", "ip route replace 172.28.0.2 dev eth0 scope link && ip route replace 172.28.0.0/16 via 172.28.0.2 dev eth0"]
    depends_on: [caddy, gateway]
