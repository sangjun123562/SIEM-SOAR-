# A · 1일 차 시험망: 단말 → 게이트웨이 → 임시 HTTP 서버
# 호스트 포트 공개 없음. 네트워크는 internal(외부 연결 없음). 게이트웨이와 라우트 사이드카만 NET_ADMIN 예외.
#
# 단말망과 서버망은 별도 internal Macvlan L2 네트워크다.
# parent를 지정하지 않아 Docker VM 내부 dummy만 사용하며 물리 NIC/LAN에는 연결하지 않는다.
# 게이트웨이만 두 망과 조치망에 연결한다. NAT 없이 단말 IP를 보존한다.
name: capstone-a

# CPU budget (day5): A 1.42 = running services 1.30 + 7 one-shot helpers 0.07 + action-probe 0.05.
# + SOC DB 0.50 + browser tunnel 0.06 = 1.98 CPUs. Rebalance before adding services.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

networks:
  client_net:
    driver: macvlan
    internal: true
    driver_opts: {macvlan_mode: bridge}  # parent 생략: Docker가 전용 dummy를 관리
    ipam:
      config: [{subnet: 172.28.10.0/24}]
  server_net:
    driver: macvlan
    internal: true
    driver_opts: {macvlan_mode: bridge}
    ipam:
      config: [{subnet: 172.28.20.0/24}]
  action_net:
    internal: true
    ipam:
      config: [{subnet: 10.250.30.0/24}]
  erp_db_net:                     # ERP와 ERP DB만 붙는 내부망(게이트웨이·단말·Caddy는 없음)
    internal: true
    ipam:
      config: [{subnet: 10.250.29.0/24}]   # 172.29.0.0/24는 Docker Desktop 내부망과 겹쳐서 사용 불가(시험에서 확인)

volumes:
  gw_logs:
  caddy_raw:    # Caddy 원본 접속 로그(변환기가 읽기 전용으로 읽음)
  caddy_logs:   # caddy.jsonl(계약 형식). 수집기는 :ro로 마운트
  caddy_data:   # Caddy 내부 CA(개인키 포함). Caddy만 마운트하고 단말에는 절대 노출하지 않는다
  caddy_ca:     # 공개 루트 인증서(root.crt)만 담아 단말이 :ro로 신뢰 저장소로 사용
  erp_db_data:  # ERP 전용 DB 데이터(관제 DB와 별개). ERP 초기화는 이 볼륨만 대상
  erp_logs:     # erp.jsonl(계약 형식). 수집기는 :ro로 마운트
  gw_actions:   # 5일 차 조치 API 승인 기록(approvals.json)·감사 기록(audit.jsonl). 게이트웨이만 마운트

services:
  gateway:
    <<: *hardening
    build: ./gateway
    image: capstone-a-gateway:day5
    container_name: capstone-a-gateway
    cap_add: [NET_ADMIN]          # 예외: iptables 차단 규칙 적용. 이 컨테이너 네임스페이스에만 영향
    # 5일 차: 조치 API(actionapi.py)도 이 컨테이너 안에서 10.250.30.2:8081에만 바인딩한다(호스트 포트 없음).
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
    read_only: true
    tmpfs: ["/run:size=8m,mode=0755", "/tmp:size=8m"]
    volumes:
      - gw_logs:/var/log/gw        # gateway.jsonl. 수집기는 이 볼륨을 읽기 전용(:ro)으로 마운트한다
      - gw_actions:/var/lib/gw-actions
    environment:
      GW_BLOCKABLE: 172.28.10.11   # 차단 허용 목록: 시험 단말 고정 IP 하나
      GW_DST_ALLOWED: 172.28.20.10,172.28.20.5   # 임시 서버와 Caddy
      GW_ACTION_TOKEN: ${GW_ACTION_TOKEN:?먼저 scripts/init_env.sh 를 실행해 조치 토큰을 만드세요}
      GW_ACTION_BIND: 10.250.30.2
      GW_ACTION_PORT: "8081"
      GW_ACTION_TARGETS: 172.28.10.11      # 조치 API 차단 대상 허용 목록(대조 단말 .12 등은 코드에서도 거부)
      GW_ACTION_CLIENTS: 10.250.30.0/24    # 조치망에서 온 요청만 받는다
    cpus: 0.25
    mem_limit: 96m
    networks:
      client_net: {ipv4_address: 172.28.10.2}
      server_net: {ipv4_address: 172.28.20.2}
      action_net: {ipv4_address: 10.250.30.2}

  web:
    <<: *hardening
    image: python:3.12-alpine
    container_name: capstone-a-web
    user: "65534:65534"
    read_only: true
    command: ["python", "/app/server.py"]
    volumes: ["./web/server.py:/app/server.py:ro"]
    cpus: 0.05
    mem_limit: 64m
    networks:
      server_net: {ipv4_address: 172.28.20.10}

  client-test:                    # 차단 대상 시험 단말
    <<: *hardening
    build: ./client
    image: capstone-a-client:day4   # alpine + curl
    container_name: capstone-a-client-test
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp:size=4m"]         # 로그인 쿠키 보관(재시작하면 사라짐)
    command: ["sleep", "infinity"]
    environment: {SSL_CERT_FILE: /trust/root.crt}   # Caddy 루트 인증서만 신뢰
    volumes: ["caddy_ca:/trust:ro"]
    depends_on:
      caddy-ca-export: {condition: service_completed_successfully}
    cpus: 0.05
    mem_limit: 32m
    networks:
      client_net: {ipv4_address: 172.28.10.11}

  client-ref:                     # 대조 단말(차단 금지)
    <<: *hardening
    build: ./client
    image: capstone-a-client:day4
    container_name: capstone-a-client-ref
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp:size=4m"]
    command: ["sleep", "infinity"]
    environment: {SSL_CERT_FILE: /trust/root.crt}   # Caddy 루트 인증서만 신뢰
    volumes: ["caddy_ca:/trust:ro"]
    depends_on:
      caddy-ca-export: {condition: service_completed_successfully}
    cpus: 0.05
    mem_limit: 32m
    networks:
      client_net: {ipv4_address: 172.28.10.12}

  # 경로 설정 일회용 사이드카: 대상 컨테이너의 네임스페이스에서만 실행하고 종료한다.
  # 양쪽 망의 게이트웨이(.2) 경유 경로를 멱등 설정한다. 서버 간 요청도 게이트웨이로 보낸다.
  route-test: &route
    <<: *hardening
    image: alpine:3.20
    container_name: capstone-a-route-test
    network_mode: "service:client-test"
    user: "0:0"
    cap_add: [NET_ADMIN]
    restart: "no"
    command: ["sh", "/set_route.sh"]   # 172.28.x 인터페이스를 찾아 게이트웨이 경유로 바꿈(멱등)
    volumes: ["./scripts/set_route.sh:/set_route.sh:ro"]
    cpus: 0.01
    mem_limit: 16m
    depends_on: [client-test, gateway]
  route-ref:
    <<: *route
    container_name: capstone-a-route-ref
    network_mode: "service:client-ref"
    depends_on: [client-ref, gateway]
  route-web:
    <<: *route
    container_name: capstone-a-route-web
    network_mode: "service:web"
    depends_on: [web, gateway]

  # 볼륨 소유자를 비 root 사용자로 맞추는 일회용 초기화(CHOWN만 허용, 종료 후 사라짐)
  caddy-init:
    <<: *hardening
    image: alpine:3.20
    container_name: capstone-a-caddy-init
    user: "0:0"
    cap_add: [CHOWN]
    restart: "no"
    command: ["chown", "65534:65534", "/raw", "/out", "/data", "/ca_out", "/erp_logs"]
    volumes: ["caddy_raw:/raw", "caddy_logs:/out", "caddy_data:/data", "caddy_ca:/ca_out", "erp_logs:/erp_logs"]
    cpus: 0.01
    mem_limit: 16m
    network_mode: none

  caddy:
    <<: *hardening
    image: caddy:2-alpine          # 시험 시점 v2.11.9
    container_name: capstone-a-caddy
    user: "65534:65534"
    read_only: true
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_raw:/var/log/caddy
      - caddy_data:/data
    tmpfs: ["/config:size=8m,uid=65534,gid=65534"]
    cpus: 0.15
    mem_limit: 96m
    depends_on:
      caddy-init: {condition: service_completed_successfully}
    networks:
      server_net: {ipv4_address: 172.28.20.5}

  # Caddy 공개 루트 인증서만 caddy_ca로 복사하는 일회용 서비스(CA 개인키는 복사하지 않음)
  caddy-ca-export:
    <<: *hardening
    image: alpine:3.20
    container_name: capstone-a-caddy-ca-export
    user: "65534:65534"           # Caddy와 같은 비 root 사용자(CA 디렉터리가 0700이라 소유자만 읽을 수 있음)
    restart: "no"
    network_mode: none
    command:
      - sh
      - -c
      - |
        i=0
        while [ ! -s /ca/caddy/pki/authorities/local/root.crt ] && [ $$i -lt 60 ]; do sleep 1; i=$$((i+1)); done
        cp /ca/caddy/pki/authorities/local/root.crt /out/root.crt && chmod 644 /out/root.crt
    volumes: ["caddy_data:/ca:ro", "caddy_ca:/out"]
    cpus: 0.01
    mem_limit: 16m
    depends_on: [caddy]

  caddy-log:                      # Caddy 원본 로그 -> 계약 형식 caddy.jsonl
    <<: *hardening
    image: python:3.12-alpine
    container_name: capstone-a-caddy-log
    user: "65534:65534"
    read_only: true
    command: ["python", "-I", "/app/caddy2jsonl.py"]
    environment: {PYTHONDONTWRITEBYTECODE: "1"}
    volumes:
      - ./caddy/caddy2jsonl.py:/app/caddy2jsonl.py:ro
      - caddy_raw:/in:ro
      - caddy_logs:/out
    tmpfs: ["/tmp:size=4m"]
    cpus: 0.05
    mem_limit: 32m
    depends_on:
      caddy-init: {condition: service_completed_successfully}
    network_mode: none            # 볼륨만 읽고 쓰므로 네트워크 불필요

  route-caddy:
    <<: *route
    container_name: capstone-a-route-caddy
    network_mode: "service:caddy"
    depends_on: [caddy, gateway]

  # ───────── 4일 차: ERP(Flask)와 ERP 전용 DB ─────────
  erp-db:
    <<: *hardening
    image: postgres:16-alpine
    container_name: capstone-a-erp-db
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # PostgreSQL 공식 이미지의 초기화(소유권 설정·사용자 전환)에 필요
    pids_limit: 100
    read_only: true
    tmpfs: ["/var/run/postgresql:size=4m", "/tmp:size=16m"]
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp_app
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD:?먼저 scripts/init_env.sh 를 실행해 testbed/.env 를 만드세요}
      TZ: UTC
    volumes:
      - erp_db_data:/var/lib/postgresql/data
      - ../erp/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_app -d erp_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 0.4
    mem_limit: 256m
    networks: [erp_db_net]        # 단말망·서버망에는 붙지 않는다

  erp:
    <<: *hardening
    build: ../erp
    image: capstone-a-erp:day4
    container_name: capstone-a-erp
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    environment:
      ERP_DB_DSN: postgresql://erp_app:${ERP_DB_PASSWORD:?}@erp-db:5432/erp_db
      ERP_SECRET_KEY: ${ERP_SECRET_KEY:?}
      TRUSTED_PROXY_IP: 172.28.20.5          # Caddy가 직접 연결했을 때만 X-Client-IP를 믿는다
      DEMO_PW_ALICE: ${DEMO_PW_ALICE:?}
      DEMO_PW_BOB: ${DEMO_PW_BOB:?}
      DEMO_PW_CAROL: ${DEMO_PW_CAROL:?}
    volumes:
      - erp_logs:/var/log/erp
    cpus: 0.3
    mem_limit: 160m
    depends_on:
      erp-db: {condition: service_healthy}
      caddy-init: {condition: service_completed_successfully}
    networks:
      server_net: {ipv4_address: 172.28.20.20}
      erp_db_net: {ipv4_address: 10.250.29.20}

  route-erp:
    <<: *route
    container_name: capstone-a-route-erp
    network_mode: "service:erp"
    depends_on: [erp, gateway]

  # ───────── 5일 차: 조치 API 시험 클라이언트(B 관제 앱 연결 전 대역) ─────────
  # profile=probe: 평소 up 에서는 생성되지 않는다. verify_day5.sh가 띄우고 끝나면 제거한다(최대 240초 후 자체 종료).
  # 조치망에만 연결되며 B의 ActionApiClient 코드를 읽기 전용으로 불러 실제 호환성을 확인한다.
  action-probe:
    <<: *hardening
    image: python:3.12-alpine
    container_name: capstone-a-action-probe
    profiles: [probe]
    restart: "no"
    user: "65534:65534"
    read_only: true
    environment:
      GW_ACTION_TOKEN: ${GW_ACTION_TOKEN:?}
      GW_ACTION_URL: http://10.250.30.2:8081
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./scripts/action_client.py:/app/action_client.py:ro
      - ../src/soc:/b_src/soc:ro           # B 소유 코드: 읽기 전용, 수정하지 않음
    command: ["sleep", "240"]
    cpus: 0.05
    mem_limit: 32m
    networks:
      action_net: {ipv4_address: 10.250.30.50}
