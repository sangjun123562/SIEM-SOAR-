name: capstone-soc

x-soc-hardening: &soc-hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  user: "10001:10001"
  pids_limit: 50
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  soc-postgres:
    image: postgres:16-alpine
    container_name: capstone-soc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soc_db
      POSTGRES_USER: soc_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: UTC
    # 호스트 포트는 공개하지 않음 (내부 네트워크 전용)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cpus: "0.35"
    mem_limit: "512m"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - soc_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - soc_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_admin -d soc_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  soc-collector:
    <<: *soc-hardening
    profiles: ["live"]
    build:
      context: .
      dockerfile: Dockerfile.soc
    container_name: capstone-soc-collector
    command: ["python", "-m", "soc.live_collector"]
    cpus: "0.06"
    mem_limit: "96m"
    environment:
      SOC_DB_DSN: ${SOC_DB_DSN:?SOC_DB_DSN must be set}
      SOC_GW_LOG: /var/log/gw/gateway.jsonl
      SOC_CADDY_LOG: /var/log/caddy/caddy.jsonl
      SOC_ERP_LOG: /var/log/erp/erp.jsonl
      SOC_POLL_INTERVAL_SECONDS: "2"
    volumes:
      - capstone-a_gw_logs:/var/log/gw:ro
      - capstone-a_caddy_logs:/var/log/caddy:ro
      - capstone-a_erp_logs:/var/log/erp:ro
    networks:
      - soc_internal
    depends_on:
      soc-postgres:
        condition: service_healthy

  soc-dashboard:
    <<: *soc-hardening
    profiles: ["live"]
    build:
      context: .
      dockerfile: Dockerfile.soc
    container_name: capstone-soc-dashboard
    command: ["python", "-m", "soc.dashboard"]
    cpus: "0.08"
    mem_limit: "96m"
    environment:
      SOC_DB_DSN: ${SOC_DB_DSN:?SOC_DB_DSN must be set}
      SOC_ACTION_API_URL: ${SOC_ACTION_API_URL:-http://10.250.30.2:8081}
      SOC_ACTION_API_TOKEN: ${SOC_ACTION_API_TOKEN:-}
      SOC_OPERATOR_USER: ${SOC_OPERATOR_USER:-soc-operator}
      SOC_OPERATOR_PASSWORD: ${SOC_OPERATOR_PASSWORD:-}
      SOC_SESSION_SECRET: ${SOC_SESSION_SECRET:-}
      SOC_DASHBOARD_BIND: "0.0.0.0"
      SOC_ALLOW_CONTAINER_BIND: "1"
      SOC_DASHBOARD_PORT: "8050"
    ports:
      - "127.0.0.1:8050:8050"
    networks:
      soc_internal: {}
      soc_ui: {}                 # 127.0.0.1:8050 공개 전용. internal 망만 있으면 Docker가 포트를 실제로 전달하지 않는다
      capstone-a_action_net:
        ipv4_address: 10.250.30.60
    depends_on:
      soc-postgres:
        condition: service_healthy

  soc-grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: capstone-soc-grafana
    profiles: ["grafana"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "0.15"
    mem_limit: "128m"
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      SOC_GRAFANA_DB_PASSWORD: ${SOC_GRAFANA_DB_PASSWORD:-grafana_readonly_change_me}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - soc_internal
      - soc_ui
    depends_on:
      soc-postgres:
        condition: service_healthy

volumes:
  soc_pg_data:
  capstone-a_gw_logs:
    external: true
  capstone-a_caddy_logs:
    external: true
  capstone-a_erp_logs:
    external: true

networks:
  soc_internal:
    driver: bridge
    internal: true
  soc_ui:                        # 대시보드만 연결. 다른 관제·시험 컨테이너는 붙이지 않는다
    driver: bridge
  capstone-a_action_net:
    external: true
